# =============================================================================
# Alert ของ Vertex
# =============================================================================
# ⚠️ label `release: prometheus-grafana` ห้ามหาย
#    Prometheus เลือก rule ด้วย ruleSelector: {matchLabels: {release: prometheus-grafana}}
#    ไม่มี label นี้ = rule ถูกสร้างแต่ไม่มีใครอ่าน และไม่มีอะไรฟ้อง
#    ตรวจได้ด้วย kubectl get prometheus -A -o jsonpath='{.items[*].spec.ruleSelector}'
#
# ⚠️ ทุก expression ต้องเหลือ label `namespace` ติดออกมาด้วย
#    AlertmanagerConfig ของ operator ใช้กลยุทธ์ OnNamespace — route ที่มาจาก CR
#    ในnamespace vertex จะถูกบังคับให้ match เฉพาะ alert ที่มี namespace="vertex"
#    alert ที่เขียน sum by (job) เฉยๆ จะไม่มี label นี้ แล้วหลุดไปหา receiver
#    "null" เงียบๆ โดยที่หน้า Alerts ยังขึ้นว่า firing ปกติ
#
# หลักที่ใช้เลือกว่าอะไรควรเป็น alert:
#   - ต้องเป็นอาการที่ "มีคนต้องลุกมาทำอะไรสักอย่าง" ไม่ใช่แค่ตัวเลขน่าสนใจ
#   - ต้องทนต่อ traffic ที่บางมากได้ ระบบนี้มีผู้ใช้ไม่กี่คน ช่วงดึกแทบไม่มี request เลย
#     ถ้าตั้ง alert จากสัดส่วนโดยไม่ดูจำนวนดิบ error เดียวตอนตีสามจะกลายเป็น 100%
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vertex-alerts
  namespace: vertex
  labels:
    release: prometheus-grafana
    app.kubernetes.io/part-of: vertex
spec:
  groups:
    - name: vertex.availability
      rules:
        # alert ที่สำคัญที่สุดในไฟล์นี้
        #
        # pet-service เคยอยู่ในสถานะนี้เป็นเวลานานโดยไม่มีใครรู้ — /metrics ตอบ 500
        # จาก label ที่เพี้ยน ขณะที่ ServiceMonitor เขียว pod Ready และ CD ก็เขียว
        # ไม่มีสัญญาณอื่นเลยนอกจากค่านี้ (VT-109)
        - alert: VertexMetricsScrapeDown
          expr: up{namespace="vertex"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus ดึง metric จาก {{ $labels.job }} ไม่ได้"
            description: >-
              ดึง /metrics ของ {{ $labels.job }} (pod {{ $labels.pod }}) ไม่ได้มา 5 นาทีแล้ว
              ตัว service อาจยังทำงานปกติอยู่ แต่กราฟทุกแผงของมันจะว่าง
              และ alert ตัวอื่นที่พึ่ง metric ของมันจะเงียบไปด้วย
            runbook: >-
              ยิง /metrics ตรงๆ จากในคลัสเตอร์เพื่อดู error จริง
              kubectl run tmp -n vertex --restart=Never --image=curlimages/curl --command --
              curl -s http://{{ $labels.job }}/metrics

        # ไม่มี pod พร้อมใช้งานเลย = ผู้ใช้เจอ 503
        - alert: VertexServiceHasNoReadyPod
          expr: kube_deployment_status_replicas_available{namespace="vertex"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }} ไม่มี pod ที่พร้อมใช้งานเลย"
            description: >-
              ไม่มี pod ที่ผ่าน readiness มา 3 นาที ผู้ใช้ที่เรียก service นี้จะได้ 503
            runbook: "kubectl -n vertex describe deploy {{ $labels.deployment }} แล้วดู event กับ log ของ pod ล่าสุด"

        # restart วนซ้ำมักแปลว่า config ผิดหรือ dependency ล่ม ไม่ใช่ความบังเอิญ
        - alert: VertexPodRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="vertex"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} restart ซ้ำหลายรอบ"
            description: "restart มากกว่า 3 ครั้งใน 15 นาที — ดู log ของ container ก่อนหน้าด้วย kubectl logs --previous"

    - name: vertex.http
      rules:
        # ใช้ทั้งสัดส่วนและจำนวนดิบคู่กัน
        #
        # ระบบนี้มีผู้ใช้ไม่กี่คน ตอนตีสามอาจมี request เดียวทั้งชั่วโมง
        # ถ้าดูแต่สัดส่วน error เดียวจะกลายเป็น 100% แล้วปลุกคนทั้งที่ไม่มีอะไรพัง
        # เงื่อนไข > 0.05 req/s แปลว่าอย่างน้อยราว 3 error ต่อนาที
        - alert: VertexHighErrorRate
          expr: |
            (
              sum by (job, namespace) (rate(http_requests_total{namespace="vertex",status=~"5.."}[10m])) > 0.05
            )
            and
            (
              sum by (job, namespace) (rate(http_requests_total{namespace="vertex",status=~"5.."}[10m]))
              /
              sum by (job, namespace) (rate(http_requests_total{namespace="vertex"}[10m])) > 0.05
            )
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} ตอบ 5xx เกิน 5% ของ request ทั้งหมด"
            description: "ค้างมา 10 นาที — หา requestId จาก Kibana แล้วไล่ตาม request path ที่พัง"

        # ช้าลงแบบค้างนานมักมาจาก database หรือ CPU ที่ถูกบีบ
        # (VT-103: บีบ CPU ของ auth-service ไว้ 0.1 core ทำให้ bcrypt ช้าสิบเท่า)
        - alert: VertexHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (job, namespace, le) (rate(http_request_duration_seconds_bucket{namespace="vertex"}[10m]))
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} ช้า — p95 เกิน 2 วินาที"
            description: "ดูว่า CPU ถูก throttle อยู่ไหมก่อนเป็นอันดับแรก แล้วค่อยดู query ของ database"

        # เติมช่องโหว่ของ VertexHighErrorRate ข้างบน
        #
        # เกณฑ์ > 0.05 req/s ของตัวนั้นแปลว่าต้องมี 5xx ราว 30 ครั้งใน 10 นาที
        # ซึ่ง auth-service ไปไม่ถึงตลอดกาล — วัดจริงได้ 0 request ต่อ 10 นาที
        # (รวมทั้งหมดตั้งแต่เปิดบริการมี 71 request) ต่อให้ login พัง 100%
        # ก็ไม่มีทางสะสม 5xx ครบ 30 ครั้งก่อนที่ window จะเลื่อนผ่าน
        #
        # ตัวนี้จึงนับจำนวนดิบอย่างเดียวไม่สนสัดส่วน ใช้ได้กับทุกระดับ traffic
        # baseline วัดเมื่อ 2026-09-05: 5xx = 0 ตลอด 7 วันทุก service
        # ดังนั้น 5 ครั้งใน 15 นาทีคือผิดปกติแน่นอน ไม่ว่าจะมี traffic มากแค่ไหน
        - alert: VertexServerErrorsLowTraffic
          expr: |
            sum by (namespace, job) (
              increase(http_requests_total{namespace="vertex",status=~"5.."}[15m])
            ) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} ตอบ 5xx {{ $value | printf \"%.0f\" }} ครั้งใน 15 นาที"
            description: >-
              นับจำนวนดิบเพราะ VertexHighErrorRate ครอบ service ที่ traffic บางมากไม่ได้
              ถ้าเป็น auth-service ให้ดู /login กับ /auth/google ก่อน

    - name: vertex.outbox
      rules:
        # outbox ที่ค้างแปลว่า event ไม่ถึงปลายทาง — back office จะเห็นข้อมูลไม่ครบ
        # โดยที่ฝั่งผู้ใช้ยังใช้งานได้ปกติ จึงไม่มีใครมาบ่นให้รู้
        - alert: VertexOutboxBacklog
          expr: outbox_pending_count{namespace="vertex"} > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "event ใน outbox ค้างมากกว่า 20 รายการ"
            description: >-
              worker ส่งไม่ทันหรือ event-service มีปัญหา · ค่านี้ควรวนกลับมาใกล้ 0 เสมอ
            runbook: >-
              SELECT id, event_type, attempts, last_error FROM pet.event_outbox
              WHERE published_at IS NULL AND attempts >= 5 ORDER BY next_attempt_at;

        # ครบ 12 ครั้งแล้ว worker จะหยุดลองเอง ถ้าไม่มี alert จะเงียบไปเลย
        - alert: VertexOutboxDeliveryFailing
          expr: rate(outbox_deliveries_total{namespace="vertex",result="failure"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "การส่ง event ล้มเหลวต่อเนื่อง"
            description: "ส่งไม่สำเร็จติดต่อกัน 15 นาที — ดู last_error ใน pet.event_outbox แล้วแก้ต้นเหตุก่อน reset attempts"

    - name: vertex.graphql
      rules:
        # ตัวเลขนี้ตีความได้สองทางและต้องรีบรู้ทั้งคู่
        # ทางหนึ่งคือมีคนยิงถล่ม อีกทางคือเพดานตั้งแน่นเกินจนผู้ใช้จริงโดนไปด้วย
        - alert: VertexGraphQLGuardrailRejecting
          expr: sum by (reason, namespace) (rate(graphql_rejected_total[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GraphQL ปฏิเสธ query ต่อเนื่อง (สาเหตุ {{ $labels.reason }})"
            description: >-
              ถ้า reason เป็น complexity หรือ depth ให้ดูก่อนว่าเป็น operation ของแอปเราเอง
              (แปลว่าเพดานแน่นเกิน) หรือเป็นชื่อที่ไม่รู้จัก (แปลว่ามีคนยิงมั่ว)
              กรอง operation ใน Kibana จาก field `rejected`

        # query ของแอปจริงตัวแพงสุดราคา 1221 ส่วนเพดานอยู่ที่ 5000
        # ถ้า p95 ไต่ขึ้นมาใกล้เพดานแปลว่าใกล้จะมีผู้ใช้โดนบล็อกแล้ว
        - alert: VertexGraphQLComplexityNearLimit
          expr: |
            histogram_quantile(0.95,
              sum by (operation, namespace, le) (rate(graphql_operation_complexity_bucket[30m]))
            ) > 4000
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "ราคาของ {{ $labels.operation }} เข้าใกล้เพดาน 5000 แล้ว"
            description: "ทบทวนว่าจะปรับ query ให้ขอน้อยลง หรือขยับเพดานจากตัวเลขจริง"

        # ⚠️ BFF ไม่ได้ export http_requests_total เลย
        #
        # VertexHighErrorRate กับ VertexHighLatency จึงครอบแค่ auth/event/pet
        # ส่วน vertex-bff ซึ่งเป็นทางเข้าหลักของแอป iOS ไม่มี alert อะไรจับ error
        # เลยจนถึงวันที่เพิ่มสามตัวข้างล่างนี้ (2026-09-05)
        #
        # baseline: result="error" = 0 ครั้งตลอด 14 วัน
        # แม้แค่ครั้งเดียวจึงถือว่ามีอะไรผิด ไม่ต้องรอให้เป็นสัดส่วน
        - alert: VertexGraphQLErrors
          expr: |
            sum by (namespace, operation) (
              increase(graphql_operations_total{result="error"}[15m])
            ) >= 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GraphQL {{ $labels.operation }} error {{ $value | printf \"%.0f\" }} ครั้งใน 15 นาที"
            description: >-
              GraphQL ตอบ HTTP 200 เสมอแม้ resolver จะพัง ดูจาก status code ไม่เห็น
              ต้องดู field errors ใน log ของ vertex-bff ที่ Kibana

        # ตัวข้างบนจับ "มีอะไรผิด" ตัวนี้จับ "พังจนใช้งานไม่ได้"
        # ใช้ทั้งจำนวนและสัดส่วนคู่กันตามหลักเดียวกับ VertexHighErrorRate
        - alert: VertexGraphQLHighErrorRate
          expr: |
            (
              sum by (namespace, operation) (increase(graphql_operations_total{result="error"}[10m])) >= 5
            )
            and
            (
              sum by (namespace, operation) (increase(graphql_operations_total{result="error"}[10m]))
              /
              sum by (namespace, operation) (increase(graphql_operations_total[10m])) > 0.2
            )
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "GraphQL {{ $labels.operation }} error เกิน 20% ของ operation นั้น"
            description: "ผู้ใช้เปิดหน้านั้นไม่ได้แล้ว ไล่จาก log ของ vertex-bff ว่า upstream service ไหนพัง"

        # ⚠️ ตัด WaterInsight ออกโดยตั้งใจ
        #
        # มันเรียก Gemini จึงช้าโดยธรรมชาติ — p95 วัดได้ 10.0 วินาทีซึ่งคือ
        # ขอบ bucket สูงสุดพอดี (bucket จบที่ 10 แล้วเป็น +Inf)
        # ถ้ารวมไว้ alert จะ firing ตลอดเวลาและกลบตัวอื่นจนไม่มีใครอ่าน
        #
        # baseline p95 ของ operation ที่เหลือ: WaterDay 0.24s · PetCaregivers 0.22s
        # · MyCats 0.07s เกณฑ์ 2 วินาทีจึงห่างจากของจริงราว 8-28 เท่า
        - alert: VertexGraphQLHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, operation, le) (
                rate(graphql_operation_duration_seconds_bucket{operation!="WaterInsight"}[10m])
              )
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GraphQL {{ $labels.operation }} ช้า — p95 เกิน 2 วินาที"
            description: "ดู upstream ก่อน — BFF เรียก pet/auth/event ต่อ ถ้าตัวใดตัวหนึ่งช้าจะเห็นที่นี่ด้วย"
