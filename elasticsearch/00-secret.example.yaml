# =============================================================================
# ตัวอย่าง Secret — คัดลอกเป็น es-secret.yaml แล้วใส่ค่าจริง
# =============================================================================
# ⚠️ es-secret.yaml ถูก .gitignore ไว้ ห้าม commit ค่าจริงเด็ดขาด
#
# สร้างด้วยคำสั่ง (อย่าพิมพ์รหัสเอง ให้สุ่ม)
#
#   kubectl create secret generic es-credentials -n observability \
#     --from-literal=ELASTIC_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=KIBANA_SYSTEM_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=FILEBEAT_PASSWORD="$(openssl rand -base64 24)"
#
# user แต่ละตัวมีหน้าที่ต่างกันโดยตั้งใจ
#   elastic         superuser — ใช้เฉพาะงานดูแลและ setup job
#   kibana_system   built-in ของ Kibana (ใช้ elastic ไม่ได้)
#   filebeat_writer สร้างเอง เขียน logs-* ได้อย่างเดียว ลบไม่ได้
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: es-credentials
  namespace: observability
type: Opaque
stringData:
  ELASTIC_PASSWORD: "REPLACE_ME"
  KIBANA_SYSTEM_PASSWORD: "REPLACE_ME"
  FILEBEAT_PASSWORD: "REPLACE_ME"
