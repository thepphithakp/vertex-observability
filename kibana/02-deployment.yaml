# =============================================================================
# Kibana — หน้าจอสำหรับดู log ใน Discover
# =============================================================================
# 🔸 ต้องใช้ strategy: Recreate
#    RollingUpdate จะสร้าง pod ใหม่ก่อนปิดตัวเก่า ทำให้ใช้โควตาสองเท่า
#    ชั่วคราว แล้วโดน ResourceQuota ปฏิเสธ — rollout จะค้างโดยไม่มี error
#    ที่ตัว Deployment ต้องไปอ่านที่ ReplicaSet ถึงจะเห็นสาเหตุ
#
# 🔸 ใช้ user kibana_system ไม่ใช่ elastic
#    Kibana ปฏิเสธที่จะ start ถ้าให้ใช้ superuser
#    รหัสของ user นี้ถูกตั้งโดย job ใน elasticsearch-setup/
#
# 🔸 ถ้า node memory ตึง ปิด Kibana ได้โดยไม่เสีย log
#      kubectl scale deploy/kibana -n observability --replicas=0
#    คืน memory 800Mi ทันที · Filebeat กับ Elasticsearch ยังเก็บ log ต่อ
#    เปิดกลับมาตอนจะดูข้อมูลก็ได้ ข้อมูลไม่หาย
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: KIBANA_SYSTEM_PASSWORD
            - name: SERVER_HOST
              value: "0.0.0.0"
            # 🔴 ต้องตั้งคู่กัน — Kibana ถูก expose ที่ /kibana ผ่าน
            # ingress/00-kibana-ingress.yaml ที่ "ไม่ rewrite path" (ต่างจาก
            # admin-dashboard/pet-management ที่ rewrite ตัด prefix ออก)
            #
            # basePath บอก Kibana ว่าตัวเองอยู่ใต้ path นี้ · rewriteBasePath
            # บอกว่า request ที่เข้ามามี path นี้ติดมาด้วยอยู่แล้ว (เพราะ
            # ingress ไม่ได้ตัดออกให้) ให้ Kibana ตัดเองก่อน route ภายใน
            #
            # ถ้าตั้งแค่ basePath โดยไม่ตั้ง rewriteBasePath: true
            # Kibana จะตัด path ซ้ำสอง route ภายในจะหาไม่เจอ ได้ 404 ทุกหน้า
            - name: SERVER_BASEPATH
              value: "/kibana"
            - name: SERVER_REWRITEBASEPATH
              value: "true"
            # ต้องเป็น URL เต็มที่ผ่าน ingress จริง ไม่ใช่ localhost
            # ไม่งั้นลิงก์ share และ alerting จะสร้าง URL ที่เข้าจากนอกไม่ได้
            # __INGRESS_HOST__ ถูกแทนที่ตอน deploy.sh apply (ดู $INGRESS_HOST)
            # ไม่ hardcode hostname จริงไว้ในไฟล์ที่ commit เพราะ repo นี้
            # เป็น public — hostname จริงเป็นข้อมูลที่ควรรู้แค่คนดูแลระบบ
            - name: SERVER_PUBLICBASEURL
              value: "http://__INGRESS_HOST__/kibana"
            # จำกัด heap ของ Node.js ให้ต่ำกว่า container limit
            # ไม่งั้น Node จะโตจนโดน OOMKilled แทนที่จะ GC ตัวเอง
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              memory: 800Mi
          # Kibana start ช้าเพราะต้องรอ Elasticsearch พร้อมก่อน
          startupProbe:
            httpGet:
              path: /kibana/api/status
              port: 5601
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /kibana/api/status
              port: 5601
            periodSeconds: 15
            failureThreshold: 3
