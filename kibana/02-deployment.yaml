# =============================================================================
# Kibana — หน้าจอสำหรับดู log ใน Discover
# =============================================================================
# 🔸 ต้องใช้ strategy: Recreate
#    RollingUpdate จะสร้าง pod ใหม่ก่อนปิดตัวเก่า ทำให้ใช้โควตาสองเท่า
#    ชั่วคราว แล้วโดน ResourceQuota ปฏิเสธ — rollout จะค้างโดยไม่มี error
#    ที่ตัว Deployment ต้องไปอ่านที่ ReplicaSet ถึงจะเห็นสาเหตุ
#
# 🔸 ใช้ user kibana_system ไม่ใช่ elastic
#    Kibana ปฏิเสธที่จะ start ถ้าให้ใช้ superuser
#    รหัสของ user นี้ถูกตั้งโดย job ใน elasticsearch-setup/
#
# 🔸 ถ้า node memory ตึง ปิด Kibana ได้โดยไม่เสีย log
#      kubectl scale deploy/kibana -n observability --replicas=0
#    คืน memory 800Mi ทันที · Filebeat กับ Elasticsearch ยังเก็บ log ต่อ
#    เปิดกลับมาตอนจะดูข้อมูลก็ได้ ข้อมูลไม่หาย
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: KIBANA_SYSTEM_PASSWORD
            - name: SERVER_HOST
              value: "0.0.0.0"
            # ถ้าไม่ตั้ง Kibana จะเตือนทุกครั้งที่ start และฟีเจอร์ที่ต้องสร้าง
            # ลิงก์ (เช่น share, alerting) จะสร้าง URL ผิด
            - name: SERVER_PUBLICBASEURL
              value: "http://localhost:5601"
            # จำกัด heap ของ Node.js ให้ต่ำกว่า container limit
            # ไม่งั้น Node จะโตจนโดน OOMKilled แทนที่จะ GC ตัวเอง
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              memory: 800Mi
          # Kibana start ช้าเพราะต้องรอ Elasticsearch พร้อมก่อน
          startupProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 15
            failureThreshold: 3
