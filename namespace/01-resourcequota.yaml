# =============================================================================
# ResourceQuota — เพดานแข็งของ ELK  (profile A · VT-62)
# =============================================================================
# นี่คือกลไกที่รับประกันว่า ELK จะไม่ไปแย่ง memory จนบริการอื่นล้ม
# k8s ปฏิเสธ pod ที่ขอเกินโควตาตั้งแต่ตอน schedule
# ELK จึงโตเกินเพดานไม่ได้เลย ไม่ว่าจะตั้ง limit ผิดหรือมี pod งอกมา
#
# ที่มาของตัวเลข
#   Elasticsearch  1,024 Mi / 1,536 Mi
#   Kibana           400 Mi /   800 Mi
#   Filebeat         100 Mi /   200 Mi
#   รวมที่รันประจำ  1,524 Mi / 2,536 Mi
#
#   เพดาน          1,700 Mi / 2,800 Mi
#
# 🔸 headroom ไม่ใช่ของฟุ่มเฟือย — ต้องมีจริง
#    เคยตั้งไว้ที่ 2,600 Mi ซึ่งเหลือช่องว่างแค่ 64 Mi
#    แล้ว setup job กับ pod ที่รันชั่วคราวตอน debug จะถูกปฏิเสธ
#    ด้วยข้อความ exceeded quota ทั้งที่ของประจำยังไม่ได้โตขึ้นเลยสักนิด
#
#    node มี 16 GB และตอนนี้ทั้งเครื่องใช้อยู่ราว 5.3 GB
#    การกันไว้ 2.8 Gi จึงไม่กระทบใคร
#
# 🔸 จงใจไม่ใส่ limits.cpu
#    ถ้าใส่ k8s จะบังคับให้ทุก pod ต้องระบุ CPU limit ซึ่งกับ JVM ของ
#    Elasticsearch จะโดน throttle ระหว่าง GC แล้ว query ค้างเป็นช่วงๆ
#    โดยหาสาเหตุยาก — เหตุผลเดียวกับที่ PostgreSQL ไม่ใส่ (ADR-013)
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1700Mi
    limits.memory: 2800Mi
    pods: "10"
    persistentvolumeclaims: "4"
