# =============================================================================
# namespace ของ observability
# =============================================================================
# แยกจาก vertex โดยตั้งใจ เพื่อให้
#   1. ตั้ง ResourceQuota ครอบ ELK ได้ต่างหาก ไม่ปนกับ service ธุรกิจ
#   2. Filebeat กรองตัวเองออกได้ง่าย — เก็บเฉพาะ namespace vertex
#      จึงไม่มีทางอ่าน log ตัวเองแล้ววนลูป
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    name: observability
