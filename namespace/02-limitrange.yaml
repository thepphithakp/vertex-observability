# =============================================================================
# LimitRange — ค่า default ของ namespace
# =============================================================================
# จำเป็นเพราะ ResourceQuota มี limits.memory อยู่
# ซึ่งทำให้ทุก pod ในnamespace นี้ "ต้อง" ระบุ memory limit
#
# ถ้าไม่มีไฟล์นี้ การรัน pod ชั่วคราวตอน debug จะถูกปฏิเสธแบบงงๆ
# ด้วยข้อความที่ไม่ได้บอกว่าต้องทำอะไร
# =============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        memory: 64Mi
        cpu: 50m
