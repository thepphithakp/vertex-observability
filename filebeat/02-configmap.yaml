apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: observability
data:
  filebeat.yml: |
    # =========================================================================
    # Filebeat — เก็บ log ของ pod เฉพาะ namespace ที่อนุญาตไว้
    # =========================================================================
    #
    # 🔸 ตอนนี้อนุญาตแค่ vertex เท่านั้น — ดูรายการที่ allowedNamespaces
    #    การเพิ่ม namespace ต้องเป็นการตัดสินใจที่ตั้งใจ ไม่ใช่เพิ่มเพราะ
    #    อยากเห็น ทุก namespace ที่เพิ่มคือ disk และ heap ของ Elasticsearch
    #    ที่เพิ่มตามจริง (ดู ResourceQuota ที่ namespace/01-resourcequota.yaml)

    # --- เก็บจากที่ไหน ---------------------------------------------------
    # ใช้ autodiscover แทนการ mount path ตายตัว เพราะ pod เกิดและตาย
    # ตลอดเวลา ทุกครั้งที่ deploy ชื่อ pod เปลี่ยน path เปลี่ยน
    # autodiscover เฝ้า API ของ k8s แล้วเริ่ม/หยุดเก็บตามอัตโนมัติ
    #
    # 🔴 กรอง namespace ที่ "ต้นทาง" ด้วย template condition ไม่ใช่ที่
    #    provider เหมือนเดิม
    #
    #    provider เดิมมี namespace: vertex ซึ่งเป็น field ที่รับได้
    #    "ค่าเดียว" เท่านั้น รองรับ namespace เดียวถาวร ขยายไม่ได้
    #
    #    ย้ายมาไว้ที่ condition ของ template แทน เพราะรองรับ or ได้
    #    เพิ่ม namespace ใหม่ทำได้แค่เติมบรรทัดในลิสต์นี้ ไม่ต้องแก้
    #    โครงสร้างอื่นเลย — ความปลอดภัยเดิมยังอยู่ครบเหมือนเดิมทุกอย่าง
    #    Filebeat ยัง "ไม่เปิดไฟล์" ของ namespace ที่ไม่อยู่ใน list นี้
    #    เพราะ condition ตัดสินใจก่อนสร้าง harvester เหมือนที่เคยทำที่
    #    provider แค่ย้ายจุดตัดสินใจลงมาอีกชั้นเดียว
    #
    #    ผลพลอยได้ที่สำคัญยังอยู่เหมือนเดิม: Filebeat อยู่ใน namespace
    #    observability ซึ่งไม่เคยอยู่ใน list นี้ จึงอ่าน log ตัวเองไม่ได้
    #    ไม่มีทางเกิดลูป log-เก็บ-log-ตัวเอง ไม่ว่าจะเพิ่ม namespace ไหน
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          scope: node

          # 🔸 ต้องเปิด deployment เอง — provider ไม่เปิดให้โดยค่าเริ่มต้น
          #
          # ชื่อ pod อย่าง pet-service-779c676458-j6gqg บอกไม่ได้ว่ามาจาก
          # deployment ไหน เพราะมีเลข hash ต่อท้ายที่เปลี่ยนทุกครั้งที่ deploy
          #
          # ถ้าไม่มีฟิลด์นี้ การกรองใน Discover ว่า "ขอ log ของ pet-service
          # ทั้งหมด" จะทำไม่ได้ ต้องไล่กรองทีละชื่อ pod ซึ่งเปลี่ยนไปเรื่อยๆ
          #
          # อาการคือฟิลด์หายไปเงียบๆ ไม่มี error ไม่ใช่ปัญหา RBAC
          # แม้จะให้สิทธิ์อ่าน replicasets ไว้แล้วก็ตาม
          #
          # namespace metadata ปิดไว้เพราะเก็บ log แค่ namespace เดียว
          # label ของ namespace จึงเหมือนกันทุก document ไม่มีประโยชน์
          # ปิดที่ต้นทางดีกว่าไปตัดทีหลังด้วย drop_fields
          add_resource_metadata:
            deployment: true
            cronjob: false
            namespace:
              enabled: false

          templates:
            # เพิ่ม namespace ใหม่ — เติม equals อีกบรรทัดในลิสต์ or นี้
            #
            #   or:
            #     - equals: {kubernetes.namespace: vertex}
            #     - equals: {kubernetes.namespace: <namespace ใหม่>}
            #
            # แค่นี้พอ ไม่ต้องแก้ที่อื่นเลย — index name และ dataset
            # ด้านล่างอ่านค่า namespace จริงจาก kubernetes.namespace
            # อัตโนมัติอยู่แล้ว ไม่ได้ hardcode "vertex" ไว้
            - condition:
                or:
                  - equals:
                      kubernetes.namespace: vertex
              config:
                - type: filestream
                  id: log-${data.kubernetes.container.id}
                  paths:
                    - /var/log/containers/*-${data.kubernetes.container.id}.log

                  # 🔴 ต้องเปิด ไม่งั้นไม่เก็บอะไรเลยแบบเงียบสนิท
                  #
                  # ไฟล์ใน /var/log/containers เป็น symlink ชี้ไป /var/log/pods
                  # ส่วน input แบบ filestream "ไม่ตาม symlink" โดยค่าเริ่มต้น
                  #
                  # อาการคือ Filebeat ขึ้นเป็น Running ปกติ autodiscover เจอ pod
                  # ครบ สร้าง input ครบ ไม่มี error สักบรรทัด แต่ harvester
                  # เปิดไฟล์ได้ 0 ไฟล์ และไม่มี document ไปถึง Elasticsearch เลย
                  #
                  # ดูได้จาก metric ที่ Filebeat พ่นทุก 30 วินาที
                  #   filebeat.harvester.open_files ต้องมากกว่า 0
                  prospector.scanner.symlinks: true

                  parsers:
                    # containerd เขียน log เป็นรูปแบบ CRI
                    #   <เวลา> <stream> <flag> <ข้อความจริง>
                    # parser นี้แกะออกมา แล้วตั้ง @timestamp จากเวลาที่
                    # runtime บันทึกตอนเขียนบรรทัดนั้น
                    - container:
                        stream: all
                        format: auto

                    # แกะ JSON ที่อยู่ในข้อความอีกชั้น
                    #
                    # 🔸 ignore_decoding_error ต้องเป็น true
                    #    ตอนนี้ pet-service กับ auth-service ยังมีบางบรรทัด
                    #    ที่ไม่ใช่ JSON (VT-60) ถ้าไม่ตั้ง Filebeat จะพ่น error
                    #    ทุกบรรทัดจน log ของตัวเองท่วมกว่า log ที่เก็บได้
                    #    บรรทัดที่แกะไม่ได้จะอยู่ในฟิลด์ message ตามเดิม
                    #    ยังค้นหาได้ปกติ แค่ไม่มีฟิลด์ย่อย
                    - ndjson:
                        target: ""
                        message_key: message
                        overwrite_keys: true
                        add_error_key: false
                        ignore_decoding_error: true

    # --- แต่งข้อมูลก่อนส่ง -----------------------------------------------
    processors:
      # ตัดฟิลด์ที่ไม่มีใครใช้ใน Discover ออก
      # ทุกฟิลด์ที่เก็บคือ disk ที่เสียไป และตัวเลือกที่รกใน sidebar
      # 🔸 kubernetes.node.labels เป็นตัวปัญหาที่สุด
      #    มันแนบ label ของ node มาทุก document ราว 10 ฟิลด์
      #    ซึ่งมีค่าเหมือนกันหมดทุกบรรทัดเพราะมี node เดียว
      #    เปลืองทั้ง disk และทำให้ sidebar ของ Discover รกจนหาของจริงไม่เจอ
      - drop_fields:
          fields:
            - agent.ephemeral_id
            - agent.id
            - agent.name
            - agent.type
            - agent.version
            - ecs.version
            - input.type
            - log.offset
            - log.file.inode
            - log.file.device_id
            - container.runtime
            - kubernetes.node.labels
            - kubernetes.node.uid
            - kubernetes.node.hostname
            - kubernetes.pod.uid
            - kubernetes.pod.ip
            - kubernetes.namespace_uid
            - kubernetes.namespace_labels
            - kubernetes.labels.pod-template-hash
          ignore_missing: true

      # สร้างชื่อ dataset สำหรับใช้เป็นชื่อ data stream
      #
      # 🔸 ทำไมต้องแปลง - เป็น _
      #    ชื่อ data stream คือ logs-<namespace>.<dataset>-prod ใช้ .
      #    เป็นตัวคั่นระหว่าง namespace กับ dataset ถ้าปล่อยชื่อ service
      #    ที่มี - ไว้ (เช่น "pet-service") Elasticsearch จะตีความ . กับ -
      #    ปนกันจนได้ dataset/namespace ผิดตัว จึงต้องแปลง - เป็น _ ก่อน
      #
      # 🔸 field ชื่อ dataset เฉยๆ ไม่ใช่ vertex.dataset
      #    เดิมตั้งชื่อ vertex.dataset เพราะตอนนั้นเก็บแค่ namespace เดียว
      #    ตอนนี้ manifest รองรับหลาย namespace แล้ว field นี้จึงไม่ควร
      #    ผูกกับชื่อ vertex อีกต่อไป — namespace จริงมาจาก
      #    kubernetes.namespace อยู่แล้ว ไม่ต้องเอามาปนกับชื่อ field นี้
      - script:
          lang: javascript
          id: set_dataset
          source: >
            function process(event) {
                // --- ชื่อ data stream ---
                var app = event.Get("kubernetes.labels.app");
                if (!app) { app = event.Get("kubernetes.container.name"); }
                if (!app) { app = "unknown"; }
                event.Put("dataset",
                          String(app).toLowerCase().replace(/[^a-z0-9_]/g, "_"));

                // --- เติม message ให้ access log ที่ไม่มีข้อความ ---
                //
                // auth-service กับ pet-service เขียน access log เป็น JSON
                // ที่มีแต่ method / path / status / latency ไม่มีฟิลด์ข้อความเลย
                //
                // ผลคือคอลัมน์ message ใน Discover ว่างเปล่าทั้งแถบ
                // ซึ่งอ่านไม่รู้เรื่องเลยว่าแต่ละบรรทัดคืออะไร
                // ต้องกดเปิดดู JSON ทีละบรรทัดจึงจะรู้
                //
                // สร้างบรรทัดสรุปให้แทน เช่น  POST /login -> 500
                var msg = event.Get("message");
                if (msg === null || msg === "") {
                    var m = event.Get("method");
                    var p = event.Get("path");
                    if (m && p) {
                        var st = event.Get("status");
                        event.Put("message",
                                  m + " " + p + " -> " + (st === null ? "?" : st));
                    }
                }
            }

    # --- ส่งไปไหน ---------------------------------------------------------
    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]
      username: "${FILEBEAT_USERNAME}"
      password: "${FILEBEAT_PASSWORD}"

      # แยก data stream ต่อ namespace และต่อ service เพื่อให้กรองใน
      # Discover ได้เร็ว และลบทิ้งแยกกันได้ถ้าวันหนึ่ง service ไหน
      # log เยอะผิดปกติ
      #
      # 🔸 ใช้ kubernetes.namespace จริง ไม่ hardcode "vertex"
      #    เดิมเขียน "logs-vertex.%{[vertex.dataset]}-prod" ตรงๆ
      #    ถ้าเพิ่ม namespace อื่นแล้วไม่แก้ตรงนี้ด้วย log ของ namespace
      #    ใหม่จะไหลไปปนใน logs-vertex.* ทั้งที่ไม่ใช่ vertex จริง
      #
      #    สำหรับ namespace vertex ผลลัพธ์เหมือนเดิมทุกประการ เพราะ
      #    kubernetes.namespace มีค่าเป็น "vertex" อยู่แล้ว — เปลี่ยน
      #    วิธีคำนวณโดยไม่กระทบชื่อ data stream ที่มีอยู่แล้วเลย
      index: "logs-%{[kubernetes.namespace]}.%{[dataset]}-prod"

    # 🔸 ปิด template และ ILM ที่ Filebeat จะติดตั้งเอง
    #
    # เราจัดการ index template และ ILM policy เองใน elasticsearch-setup/
    # ถ้าไม่ปิด Filebeat จะเขียนทับด้วยของตัวเองตอน start
    # แล้วได้ mapping ที่ไม่ได้ตั้งใจ กับ retention ที่ไม่ใช่ 7 วัน
    #
    # กับดักคือมันไม่มี error ให้เห็น — index ถูกสร้างสำเร็จ ทุกอย่างดูปกติ
    # แล้วมารู้ตอนกรองใน Discover ไม่ได้ หรือ disk เต็มเพราะไม่มีอะไรลบ
    setup.template.enabled: false
    setup.ilm.enabled: false
    setup.dashboards.enabled: false

    # log ของ Filebeat เอง — ให้ออก stdout เพื่อดูด้วย kubectl logs
    logging.level: info
    logging.to_files: false

    # endpoint สำหรับ health check ของ probe
    #
    # 🔴 ต้องเป็น 0.0.0.0 ไม่ใช่ 127.0.0.1
    #    kubelet ต่อ probe เข้ามาที่ pod IP ไม่ใช่ loopback ของ container
    #    ถ้าฟังแค่ 127.0.0.1 probe จะล้มเหลวทุกครั้ง แล้ว Filebeat
    #    จะถูกฆ่าทุก ~2 นาทีจนเข้า CrashLoopBackOff
    #
    #    อาการหลอกมาก: kubectl rollout status รายงานว่าสำเร็จ
    #    เพราะตอนนั้น pod ยัง Ready อยู่จริง แล้วค่อยตายทีหลัง
    #
    #    endpoint นี้ให้แค่ metric ภายใน ไม่มีข้อมูลความลับ
    #    และเป็นทางที่ Prometheus จะเข้ามา scrape ได้ในอนาคต
    http.enabled: true
    http.host: 0.0.0.0
    http.port: 5066
