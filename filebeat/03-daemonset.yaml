# =============================================================================
# Filebeat — DaemonSet เก็บ log ของ pod ใน namespace vertex
# =============================================================================
# ใช้ DaemonSet เพราะ log ของ container อยู่บน filesystem ของแต่ละ node
# ต้องมีตัวเก็บอยู่ทุก node ตอนนี้มี node เดียวแต่เขียนแบบนี้ไว้
# วันที่เพิ่ม node จะได้ทำงานเองโดยไม่ต้องแก้อะไร
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: observability
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
      annotations:
        # บังคับให้ pod เกิดใหม่เมื่อ ConfigMap เปลี่ยน
        # ไม่มีบรรทัดนี้ การแก้ filebeat.yml จะไม่มีผลจนกว่าจะ restart เอง
        # ซึ่งเป็นกับดักที่ทำให้เสียเวลาไล่ปัญหาบ่อยมาก
        checksum/config: "REPLACED_BY_DEPLOY_SCRIPT"
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      # รันบน node ทุกตัวรวมถึงที่มี taint
      # ตอนนี้ node ไม่มี taint แต่ใส่ไว้เพราะถ้าวันหนึ่งเพิ่ม control-plane
      # ที่มี taint แล้ว log ของ node นั้นจะหายไปเงียบๆ โดยไม่มีใครรู้
      tolerations:
        - operator: Exists
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          imagePullPolicy: IfNotPresent
          args:
            - -e                      # ให้ log ออก stderr เพื่อดูด้วย kubectl logs
            - -c
            - /etc/filebeat.yml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FILEBEAT_USERNAME
              value: filebeat_writer
            - name: FILEBEAT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: FILEBEAT_PASSWORD
          securityContext:
            # ต้องเป็น root เพราะ /var/log/pods เป็นของ root โหมด 0750
            # เป็นข้อจำกัดของการเก็บ log จาก filesystem ของ node
            # ชดเชยด้วยการ mount แบบอ่านอย่างเดียว และ RBAC ที่อ่านได้อย่างเดียว
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 200Mi
          livenessProbe:
            httpGet:
              path: /
              port: 5066
              host: 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: registry
              mountPath: /usr/share/filebeat/data
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        # /var/log ครอบคลุมทั้ง /var/log/containers และ /var/log/pods
        # containerd เขียนไฟล์จริงไว้ที่ /var/log/pods ส่วน /var/log/containers
        # เป็นแค่ symlink ชี้เข้าไป — ถ้า mount แค่ containers จะอ่านไม่ได้
        # เพราะ symlink ชี้ไปนอก mount
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        # 🔴 registry ต้องอยู่บน host ไม่ใช่ใน container (F3 จาก review)
        #
        # Filebeat จำว่าอ่านแต่ละไฟล์ถึง byte ไหนไว้ที่นี่
        # ถ้าเก็บใน container filesystem มันจะหายทุกครั้งที่ pod เกิดใหม่
        # แล้ว Filebeat จะอ่าน log เก่าทั้งหมดส่งซ้ำเข้า Elasticsearch
        #
        # ผลคือทุกครั้งที่ deploy จะมี log ซ้ำท่วม แยกไม่ออกว่าอันไหนของจริง
        - name: registry
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
